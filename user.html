<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Registered Users</title>

<style>

body{
    font-family:Arial;
    background:#f2f5f9;
    padding:40px;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#007BFF;
    color:white;
    padding:12px;
}

td{
    padding:10px;
    text-align:center;
}

table,th,td{
    border:1px solid #ccc;
}

button{
    margin-top:20px;
    padding:10px 20px;
    background:#28a745;
    color:white;
    border:none;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#1e7e34;
}

.center{
    text-align:center;
}

</style>

</head>

<body>

<h2>Registered Users</h2>

<table id="table">

<tr>
<th>First Name</th>
<th>Last Name</th>
<th>Email</th>
<th>Password</th>
<th>Confirm Password</th>
<th>DOB</th>
<th>Gender</th>
<th>Mobile Number</th>
<th>Address</th>
<th>Pincode</th>
</tr>

</table>

<div class="center">

<button onclick="window.location='register.html'">
Register Another User
</button>

</div>

<script>

let users = JSON.parse(localStorage.getItem("users")) || [];

let table = document.getElementById("table");

users.forEach(function(u){

table.innerHTML += `

<tr>

<td>${u.firstname}</td>
<td>${u.lastname}</td>
<td>${u.email}</td>
<td>${u.password}</td>
<td>${u.confirm}</td>
<td>${u.dob}</td>
<td>${u.gender}</td>
<td>${u.mobile}</td>
<td>${u.address}</td>
<td>${u.pincode}</td>

</tr>

`;

});

</script>

</body>
</html>
